---
clusterName: woohp
talosVersion: v1.13.6
kubernetesVersion: v1.36.2
endpoint: https://192.168.1.100:6443
domain: woohp.local
allowSchedulingOnMasters: true
additionalMachineCertSans:
  - 192.168.1.100
nodes:
  - hostname: sam
    ipAddress: 192.168.1.101
    controlPlane: true
    installDisk: /dev/nvme0n1
    patches:
      - |-
        machine:
          network:
            interfaces:
              - addresses:
                  - 192.168.1.101/24
                interface: enp1s0f0
                dhcp: false
                routes:
                  - gateway: 192.168.1.254
                    network: 0.0.0.0/0
                vip:
                  ip: 192.168.1.100
          kubelet:
            extraMounts:
              - destination: /var/lib/longhorn
                type: bind
                source: /var/lib/longhorn
                options:
                  - bind
                  - rshared
                  - rw
    schematic:
      customization:
        systemExtensions:
          officialExtensions:
            - siderolabs/iscsi-tools
            - siderolabs/util-linux-tools

  - hostname: clover
    ipAddress: 192.168.1.102
    controlPlane: true
    installDisk: /dev/nvme0n1
    patches:
      - |-
        machine:
          network:
            interfaces:
              - addresses:
                  - 192.168.1.102/24
                interface: enp1s0f0
                dhcp: false
                routes:
                  - gateway: 192.168.1.254
                    network: 0.0.0.0/0
                vip:
                  ip: 192.168.1.100
          kubelet:
            extraMounts:
              - destination: /var/lib/longhorn
                type: bind
                source: /var/lib/longhorn
                options:
                  - bind
                  - rshared
                  - rw
    schematic:
      customization:
        systemExtensions:
          officialExtensions:
            - siderolabs/iscsi-tools
            - siderolabs/util-linux-tools

  - hostname: alex
    ipAddress: 192.168.1.103
    controlPlane: true
    installDisk: /dev/nvme0n1
    patches:
      - |-
        machine:
          network:
            interfaces:
              - addresses:
                  - 192.168.1.103/24
                interface: enp1s0f0
                dhcp: false
                routes:
                  - gateway: 192.168.1.254
                    network: 0.0.0.0/0
          kubelet:
            extraMounts:
              - destination: /var/lib/longhorn
                type: bind
                source: /var/lib/longhorn
                options:
                  - bind
                  - rshared
                  - rw
    schematic:
      customization:
        systemExtensions:
          officialExtensions:
            - siderolabs/iscsi-tools
            - siderolabs/util-linux-tools

  - hostname: mandy
    ipAddress: 192.168.1.104
    controlPlane: false
    # NOTE: interface/installDisk copiés des CP — À VÉRIFIER en maintenance mode
    # sur l'Acer Nitro avant le 1er apply (talosctl get links/disks --insecure).
    installDisk: /dev/nvme0n1
    patches:
      - |-
        machine:
          network:
            interfaces:
              - addresses:
                  - 192.168.1.104/24
                interface: enp1s0f0
                dhcp: false
                routes:
                  - gateway: 192.168.1.254
                    network: 0.0.0.0/0
          kubelet:
            extraMounts:
              - destination: /var/lib/longhorn
                type: bind
                source: /var/lib/longhorn
                options:
                  - bind
                  - rshared
                  - rw
          kernel:
            modules:
              - name: nvidia
              - name: nvidia_uvm
              - name: nvidia_drm
              - name: nvidia_modeset
          sysctls:
            net.core.bpf_jit_harden: 1
    schematic:
      customization:
        systemExtensions:
          officialExtensions:
            - siderolabs/iscsi-tools
            - siderolabs/util-linux-tools
            - siderolabs/nonfree-kmod-nvidia-lts
            - siderolabs/nvidia-container-toolkit-lts
