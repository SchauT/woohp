---
clusterName: woohp
talosVersion: v1.14.1
kubernetesVersion: v1.37.1
endpoint: https://192.168.1.100:6443
domain: woohp.local
allowSchedulingOnMasters: true
additionalMachineCertSans:
  - 192.168.1.100
patches:
  - |-
    machine:
      sysctls:
        # NFS has no cgroup writeback, so dirty pages are only throttled by the
        # global limit (default 20% of RAM, ≈3.4G on mandy). Fast qBittorrent
        # downloads to the NAS filled its 3Gi memcg with dirty pages → OOMKill.
        # Absolute caps below any NFS writer's memory limit throttle the writer instead.
        vm.dirty_background_bytes: 268435456 # 256Mi
        vm.dirty_bytes: 1073741824 # 1Gi
      kubelet:
        extraMounts:
          - destination: /var/lib/longhorn
            type: bind
            source: /var/lib/longhorn
            options:
              - bind
              - rshared
              - rw
        extraConfig:
          systemReserved:
            memory: 512Mi
          kubeReserved:
            memory: 512Mi
          evictionHard:
            memory.available: "500Mi"
            nodefs.available: "10%"
            imagefs.available: "15%"
            nodefs.inodesFree: "5%"
controlPlane:
  patches:
    # nftables kube-proxy only serves NodePorts on the node's primary IP by default;
    # widen to the LAN so the VIP .100 answers too (router forwards 80/443 to VIP:30080/30443 -> traefik)
    - |-
      apiVersion: v1alpha1
      kind: KubeProxyConfig
      config:
        nodePortAddresses:
          - 192.168.1.0/24
    - |-
      apiVersion: v1alpha1
      kind: KubeEtcdEncryptionConfig
      $$patch: delete
    - |-
      apiVersion: v1alpha1
      kind: KubeEtcdEncryptionConfig
      config:
        resources:
          - providers:
              - secretbox:
                  keys:
                    - name: key2
                      secret: ${SECRETBOX_ENCRYPTION_SECRET}
              - identity: {}
            resources:
              - secrets
nodes:
  - hostname: sam
    ipAddress: 192.168.1.101
    controlPlane: true
    installDisk: /dev/nvme0n1
    patches:
      - |-
        machine:
          network:
            interfaces:
              - addresses:
                  - 192.168.1.101/24
                interface: enp1s0f0
                dhcp: false
                routes:
                  - gateway: 192.168.1.254
                    network: 0.0.0.0/0
                vip:
                  ip: 192.168.1.100
    schematic:
      customization:
        systemExtensions:
          officialExtensions:
            - siderolabs/iscsi-tools
            - siderolabs/util-linux-tools

  - hostname: clover
    ipAddress: 192.168.1.102
    controlPlane: true
    installDisk: /dev/nvme0n1
    patches:
      - |-
        machine:
          network:
            interfaces:
              - addresses:
                  - 192.168.1.102/24
                interface: enp1s0f0
                dhcp: false
                routes:
                  - gateway: 192.168.1.254
                    network: 0.0.0.0/0
                vip:
                  ip: 192.168.1.100
    schematic:
      customization:
        systemExtensions:
          officialExtensions:
            - siderolabs/iscsi-tools
            - siderolabs/util-linux-tools

  - hostname: alex
    ipAddress: 192.168.1.103
    controlPlane: true
    installDisk: /dev/nvme0n1
    patches:
      - |-
        machine:
          network:
            interfaces:
              - addresses:
                  - 192.168.1.103/24
                interface: enp1s0f0
                dhcp: false
                routes:
                  - gateway: 192.168.1.254
                    network: 0.0.0.0/0
                vip:
                  ip: 192.168.1.100
    schematic:
      customization:
        systemExtensions:
          officialExtensions:
            - siderolabs/iscsi-tools
            - siderolabs/util-linux-tools

  - hostname: mandy
    ipAddress: 192.168.1.104
    controlPlane: false
    # Vérifié en maintenance mode : SSD SATA 256G (sda=clé USB de boot,
    # sdc=HDD 1To libre pour du stockage). NIC filaire = enp3s0f1.
    installDisk: /dev/sdb
    patches:
      - |-
        machine:
          network:
            interfaces:
              - addresses:
                  - 192.168.1.104/24
                interface: enp3s0f1
                dhcp: false
                routes:
                  - gateway: 192.168.1.254
                    network: 0.0.0.0/0
          kernel:
            modules:
              - name: nvidia
              - name: nvidia_uvm
              - name: nvidia_drm
              - name: nvidia_modeset
          sysctls:
            net.core.bpf_jit_harden: 1
    schematic:
      customization:
        systemExtensions:
          officialExtensions:
            - siderolabs/iscsi-tools
            - siderolabs/util-linux-tools
            - siderolabs/nonfree-kmod-nvidia-lts
            - siderolabs/nvidia-container-toolkit-lts
