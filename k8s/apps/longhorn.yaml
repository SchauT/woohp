apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
    # added by ArgoCD on apps whose chart has a helm pre-delete hook (longhorn uninstall job);
    # declared here so app-of-apps self-heal stops stripping them in a loop
    - pre-delete-finalizer.argocd.argoproj.io
    - pre-delete-finalizer.argocd.argoproj.io/cleanup
spec:
  project: default
  source:
    repoURL: 'https://github.com/SchauT/woohp.git'
    targetRevision: HEAD
    path: k8s/charts/longhorn
    helm:
      releaseName: longhorn
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
