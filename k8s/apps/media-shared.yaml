apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: media-shared
  namespace: argocd
  annotations:
    # Deploy before other media apps so namespace + PVC + secret exist first
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/SchauT/woohp.git'
    targetRevision: HEAD
    path: k8s/charts/media-shared
    helm:
      releaseName: media-shared
      valueFiles:
        - values.yaml
        - secrets.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: media
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
