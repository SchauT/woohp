apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-data-nfs
spec:
  capacity:
    storage: {{ .Values.nfs.capacity }}
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: {{ .Values.nfs.server }}
    path: {{ .Values.nfs.path }}
  mountOptions:
    - nfsvers=4.2
    - hard
    - noatime
