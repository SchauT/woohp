apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "qbittorrent.fullname" . }}
  labels:
    {{- include "qbittorrent.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Recreate required: config PVC is ReadWriteOnce
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "qbittorrent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Restart pod when the init ConfigMap changes
        checksum/config: {{ include (print .Template.BasePath "/configmap-init.yaml") . | sha256sum }}
      labels:
        {{- include "qbittorrent.labels" . | nindent 8 }}
    spec:
      initContainers:
        - name: gluetun
          image: "{{ .Values.gluetun.image.repository }}:{{ .Values.gluetun.image.tag }}"
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          env:
            - name: VPN_SERVICE_PROVIDER
              value: {{ .Values.gluetun.vpnServiceProvider | quote }}
            - name: VPN_TYPE
              value: {{ .Values.gluetun.vpnType | quote }}
            - name: SERVER_COUNTRIES
              value: {{ .Values.gluetun.serverCountries | quote }}
            - name: VPN_PORT_FORWARDING
              value: "on"
            - name: PORT_FORWARDING_ONLY
              value: "yes"
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: {{ .Values.gluetun.firewallOutboundSubnets | quote }}
            - name: HTTP_CONTROL_SERVER_ADDRESS
              value: ":{{ .Values.gluetun.controlPort }}"
            # Disable auth so the K8s readiness probe can reach the control server
            # (safe: port is only accessible within the pod)
            - name: HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE
              value: '{"auth":"none"}'
            - name: WIREGUARD_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: gluetun-vpn-credentials
                  key: wireguard-private-key
            - name: WIREGUARD_ADDRESSES
              valueFrom:
                secretKeyRef:
                  name: gluetun-vpn-credentials
                  key: wireguard-addresses
          readinessProbe:
            httpGet:
              path: /v1/vpn/status
              port: {{ .Values.gluetun.controlPort }}
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 40
          {{- with .Values.resources.gluetun }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tun-device
              mountPath: /dev/net/tun
            - name: gluetun-data
              mountPath: /tmp/gluetun
      containers:
        - name: qbittorrent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PUID
              value: {{ .Values.env.PUID | quote }}
            - name: PGID
              value: {{ .Values.env.PGID | quote }}
            - name: UMASK
              value: {{ .Values.env.UMASK | quote }}
            - name: TZ
              value: {{ .Values.env.TZ | quote }}
            - name: WEBUI_PORT
              value: {{ .Values.webuiPort | quote }}
            # VueTorrent alternative WebUI — installed at /vuetorrent by the LSIO mod
            - name: DOCKER_MODS
              value: "ghcr.io/vuetorrent/vuetorrent-lsio-mod:latest"
          ports:
            - name: webui
              containerPort: {{ .Values.webuiPort }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: webui
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: webui
            initialDelaySeconds: 60
            periodSeconds: 20
          {{- with .Values.resources.qbittorrent }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media-data
              mountPath: /data
            - name: qbittorrent-init
              mountPath: /custom-cont-init.d
            - name: gluetun-data
              mountPath: /tmp/gluetun
              readOnly: true
      volumes:
        - name: tun-device
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: config
          persistentVolumeClaim:
            claimName: {{ include "qbittorrent.fullname" . }}-config
        - name: qbittorrent-init
          configMap:
            name: {{ include "qbittorrent.fullname" . }}-init
            defaultMode: 0755
        - name: media-data
          persistentVolumeClaim:
            claimName: media-data
        - name: gluetun-data
          emptyDir: {}
