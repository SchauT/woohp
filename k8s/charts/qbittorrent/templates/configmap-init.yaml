apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "qbittorrent.fullname" . }}-init
  labels:
    {{- include "qbittorrent.labels" . | nindent 4 }}
data:
  01-qbittorrent-config.sh: |
    #!/bin/sh
    # Declarative qBittorrent [Preferences] — managed via GitOps (ConfigMap).
    # Source of truth: Git. Changes made in the WebUI are reset on pod restart.
    # Torrent state lives in BT_backup/ and is NOT affected by this script.
    #
    # Backslash note: qBittorrent INI keys contain backslashes (e.g. WebUI\Port).
    # awk -v strips unrecognised escapes (\R→R), so we use printf with \\ instead
    # (YAML literal block → shell sees \\foo → printf outputs \foo).
    set -e

    CONF="/config/qBittorrent/qBittorrent.conf"
    mkdir -p "$(dirname "$CONF")"

    # Keep all sections except [Preferences] from any existing config
    # ([BitTorrent] holds torrent session state, [Network] proxy settings, etc.)
    BASE="${CONF}.init-base"
    if [ -f "$CONF" ]; then
      awk '/^\[Preferences\]/{skip=1;next} /^\[/{skip=0} !skip{print}' "$CONF" > "$BASE"
    else
      # Fresh install: seed legal notice acceptance so qBittorrent does not prompt.
      printf '[LegalNotice]\nAccepted=true\n\n' > "$BASE"
    fi

    # Write our controlled [Preferences] block.
    # Each printf '\\ ' in this script is two chars in the YAML literal block,
    # which the shell receives as '\\', and printf renders as a single '\'.
    {
      printf '[Preferences]\n'
      printf 'Downloads\\SavePath=/data/downloads/complete/\n'
      printf 'Downloads\\TempPath=/data/downloads/incomplete/\n'
      printf 'Downloads\\TempPathEnabled=true\n'
      printf 'WebUI\\AlternativeUIEnabled=true\n'
      printf 'WebUI\\AuthSubnetWhitelist=0.0.0.0/0, ::/0\n'
      printf 'WebUI\\AuthSubnetWhitelistEnabled=true\n'
      printf 'WebUI\\LocalHostAuth=false\n'
      printf 'WebUI\\RootFolder=/vuetorrent\n'
    } >> "$BASE"

    mv "$BASE" "$CONF"
