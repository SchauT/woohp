apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "qbittorrent.fullname" . }}-init
  labels:
    {{- include "qbittorrent.labels" . | nindent 4 }}
data:
  01-qbittorrent-config.sh: |
    #!/bin/sh
    # Torrent state lives in BT_backup/ and is NOT affected by this script.
    set -e

    CONF="/config/qBittorrent/qBittorrent.conf"
    mkdir -p "$(dirname "$CONF")"

    # Keep all sections except [Preferences], [BitTorrent], and [Core] from any existing config.
    BASE="${CONF}.init-base"
    if [ -f "$CONF" ]; then
      awk '/^\[Preferences\]/{skip=1;next} /^\[BitTorrent\]/{skip=1;next} /^\[Core\]/{skip=1;next} /^\[/{skip=0} !skip{print}' "$CONF" > "$BASE"
    else
      # Fresh install: seed legal notice acceptance so qBittorrent does not prompt.
      printf '[LegalNotice]\nAccepted=true\n\n' > "$BASE"
    fi

    # Write our controlled [BitTorrent], [Core] and [Preferences] blocks.
    # Each printf '\\ ' in this script is two chars in the YAML literal block,
    # which the shell receives as '\\', and printf renders as a single '\'.
    {
      printf '[BitTorrent]\n'
      printf 'Session\\DefaultSavePath=/data/torrents/complete/\n'
      printf 'Session\\TempPath=/data/torrents/incomplete/\n'
      printf 'Session\\TempPathEnabled=true\n'
      printf 'Session\\Port=54958\n'
      printf 'Session\\AddTorrentStopped=false\n'
      printf 'Session\\AlternativeGlobalDLSpeedLimit=0\n'
      printf 'Session\\AlternativeGlobalUPSpeedLimit=0\n'
      printf 'Session\\UseAlternativeGlobalSpeedLimit=false\n'
      printf 'Session\\BandwidthSchedulerEnabled=false\n'
      printf 'Session\\DisableAutoTMMByDefault=false\n'
      printf 'Session\\ExcludedFileNames=\n'
      printf 'Session\\GlobalMaxRatio=3\n'
      printf 'Session\\GlobalUPSpeedLimit=3000\n'
      printf 'Session\\IgnoreSlowTorrentsForQueueing=false\n'
      printf 'Session\\MaxActiveDownloads=1\n'
      printf 'Session\\MaxActiveTorrents=10\n'
      printf 'Session\\MaxActiveUploads=10\n'
      printf 'Session\\QueueingSystemEnabled=false\n'
      printf 'Session\\ReannounceWhenAddressChanged=true\n'
      printf 'Session\\ShareLimitAction=Stop\n'
      printf '\n'
      printf '[Core]\n'
      printf 'AutoDeleteAddedTorrentFile=Never\n'
      printf '\n'
      printf '[Preferences]\n'
      printf 'Downloads\\SavePath=/data/torrents/complete/\n'
      printf 'Downloads\\TempPath=/data/torrents/incomplete/\n'
      printf 'Downloads\\TempPathEnabled=true\n'
      printf 'WebUI\\AlternativeUIEnabled=true\n'
      printf 'WebUI\\AuthSubnetWhitelist=0.0.0.0/0, ::/0\n'
      printf 'WebUI\\AuthSubnetWhitelistEnabled=true\n'
      printf 'WebUI\\LocalHostAuth=false\n'
      printf 'WebUI\\RootFolder=/vuetorrent\n'
    } >> "$BASE"

    mv "$BASE" "$CONF"
  02-port-sync.sh: |
    #!/bin/sh
    # Watches /tmp/gluetun/forwarded_port and syncs Gluetun's ProtonVPN
    # forwarded port to qBittorrent's listen port via the Web API.
    # Runs as a background daemon so the container init completes immediately.

    QBT_API="http://localhost:{{ .Values.webuiPort }}/api/v2"
    PORT_FILE="/tmp/gluetun/forwarded_port"
    STATE_FILE="/tmp/qbt-synced-port"
    INTERVAL=20

    _sync() {
      PORT=$(cat "$PORT_FILE" 2>/dev/null | tr -d '[:space:]')
      [ -z "$PORT" ] && return
      PREV=$(cat "$STATE_FILE" 2>/dev/null)
      [ "$PORT" = "$PREV" ] && return
      if wget -qO- \
          --post-data "json={\"listen_port\":${PORT}}" \
          "${QBT_API}/app/setPreferences" > /dev/null 2>&1; then
        echo "$PORT" > "$STATE_FILE"
        echo "[port-sync] Updated qBittorrent listen port to ${PORT}"
      fi
    }

    while true; do
      _sync
      sleep "$INTERVAL"
    done &
