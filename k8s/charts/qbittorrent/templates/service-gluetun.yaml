apiVersion: v1
kind: Service
metadata:
  name: gluetun
  labels:
    {{- include "qbittorrent.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.gluetun.controlPort }}
      targetPort: {{ .Values.gluetun.controlPort }}
      protocol: TCP
      name: control
  selector:
    {{- include "qbittorrent.selectorLabels" . | nindent 4 }}
