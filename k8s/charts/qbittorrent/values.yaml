image:
  repository: lscr.io/linuxserver/qbittorrent
  pullPolicy: IfNotPresent
  tag: "5.1.4-r3-ls453"

webuiPort: 8200

env:
  PUID: "3001"
  PGID: "3001"
  UMASK: "0002"
  TZ: "Europe/Paris"

gluetun:
  image:
    repository: qmcgaw/gluetun
    tag: "v3.41.3"
  controlPort: 8320
  vpnServiceProvider: protonvpn
  vpnType: wireguard
  serverCountries: Switzerland
  # Allow LAN + pod + service subnets to bypass the VPN
  firewallOutboundSubnets: "192.168.1.0/24,10.244.0.0/16,10.96.0.0/12"

persistence:
  config:
    storageClass: longhorn
    size: 5Gi

service:
  type: ClusterIP
  port: 8200

ingress:
  enabled: true
  className: tailscale
  hosts:
    - host: qbittorrent
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - qbittorrent
      secretName: qbittorrent-tls

resources:
  qbittorrent:
    requests:
      cpu: 200m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 2Gi
  gluetun:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 256Mi
