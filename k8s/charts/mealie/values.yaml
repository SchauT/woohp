image:
  repository: ghcr.io/mealie-recipes/mealie
  pullPolicy: IfNotPresent
  tag: "v3.24.0"

containerPort: 9000

securityContext:
  runAsUser: 911
  runAsGroup: 911
  fsGroup: 911

env:
  TZ: "Europe/Paris"
  BASE_URL: "https://mealie.raccoon-pence.ts.net"
  ALLOW_SIGNUP: "false"

persistence:
  data:
    storageClass: longhorn
    size: 2Gi

service:
  type: ClusterIP
  port: 9000

ingress:
  enabled: true
  className: tailscale
  hosts:
    - host: mealie
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - mealie
      secretName: mealie-tls

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
