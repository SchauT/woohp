image:
  repository: lscr.io/linuxserver/prowlarr
  pullPolicy: IfNotPresent
  tag: "2.4.0"

containerPort: 9696

securityContext:
  runAsUser: 3001
  runAsGroup: 3001
  fsGroup: 3001

env:
  TZ: "Europe/Paris"

persistence:
  config:
    storageClass: longhorn
    size: 2Gi

service:
  type: ClusterIP
  port: 9696

ingress:
  enabled: true
  className: tailscale
  hosts:
    - host: prowlarr
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - prowlarr
      secretName: prowlarr-tls

resources:
  requests:
    cpu: 50m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 512Mi
