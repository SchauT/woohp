apiVersion: v1
kind: Secret
metadata:
  name: n8n-core-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
type: Opaque
stringData:
  N8N_ENCRYPTION_KEY: {{ .Values.encryptionKey | quote }}
  N8N_HOST: {{ .Values.host | quote }}
  N8N_PORT: {{ .Values.port | quote }}
  N8N_PROTOCOL: {{ .Values.protocol | quote }}
