image:
  repository: jellyfin/jellyfin
  pullPolicy: IfNotPresent
  tag: "12.4"

containerPort: 8096

securityContext:
  runAsUser: 3001
  runAsGroup: 3001
  fsGroup: 3001

env:
  TZ: "Europe/Paris"

persistence:
  config:
    storageClass: longhorn
    size: 10Gi

service:
  # NodePort: LAN clients (Apple TV) stream directly at http://192.168.1.104:30096
  # instead of going through the public ingress. Remote access: https://watch.schaut.fr (traefik).
  type: NodePort
  port: 8096
  nodePort: 30096

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: watch.schaut.fr
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - watch.schaut.fr
      secretName: jellyfin-tls

resources:
  requests:
    cpu: 500m
    memory: 8Gi
  limits:
    cpu: "4"
    memory: 8Gi
    nvidia.com/gpu: 1
