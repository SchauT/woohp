apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "paperless.fullname" . }}
  labels:
    {{- include "paperless.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "paperless.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "paperless.labels" . | nindent 8 }}
    spec:
      enableServiceLinks: false
      containers:
        - name: paperless
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: TZ
              value: {{ .Values.env.TZ | quote }}
            - name: PAPERLESS_TIME_ZONE
              value: {{ .Values.env.TZ | quote }}
            - name: PAPERLESS_URL
              value: {{ .Values.env.url | quote }}
            - name: PAPERLESS_OCR_LANGUAGE
              value: {{ .Values.env.ocrLanguage | quote }}
            - name: PAPERLESS_SECRET_KEY
              value: {{ .Values.secretKey | quote }}
            - name: PAPERLESS_REDIS
              value: "redis://{{ include "paperless.fullname" . }}-redis:6379"
            - name: PAPERLESS_DBENGINE
              value: "postgresql"
            - name: PAPERLESS_DBHOST
              value: "paperless-db-rw"
            - name: PAPERLESS_DBPORT
              value: "5432"
            - name: PAPERLESS_DBNAME
              value: "paperless"
            - name: PAPERLESS_DBUSER
              valueFrom:
                secretKeyRef:
                  name: paperless-db-app
                  key: username
            - name: PAPERLESS_DBPASS
              valueFrom:
                secretKeyRef:
                  name: paperless-db-app
                  key: password
            {{- if .Values.admin.user }}
            - name: PAPERLESS_ADMIN_USER
              value: {{ .Values.admin.user | quote }}
            {{- end }}
            {{- if .Values.admin.password }}
            - name: PAPERLESS_ADMIN_PASSWORD
              value: {{ .Values.admin.password | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 5
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /usr/src/paperless/data
            - name: media
              mountPath: /usr/src/paperless/media
            - name: consume
              mountPath: /usr/src/paperless/consume
            - name: export
              mountPath: /usr/src/paperless/export
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "paperless.fullname" . }}-data
        - name: media
          persistentVolumeClaim:
            claimName: {{ include "paperless.fullname" . }}-media
        - name: consume
          persistentVolumeClaim:
            claimName: {{ include "paperless.fullname" . }}-consume
        - name: export
          persistentVolumeClaim:
            claimName: {{ include "paperless.fullname" . }}-export
