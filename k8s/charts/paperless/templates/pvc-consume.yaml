apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "paperless.fullname" . }}-consume
  labels:
    {{- include "paperless.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.persistence.consume.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.consume.size }}
