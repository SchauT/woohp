# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
# TRaSH Guides French profiles (MULTi = VF + VO preferred).
# Extra penalty on audio/video the Apple TV can't decode natively (DTS, TrueHD, VC-1):
# -300 keeps MULTi DTS (+500-300) above VF-only EAC3 (0), but below MULTi EAC3 (+500).

sonarr:
  series:
    base_url: http://sonarr.media.svc.woohp.local:8989
    api_key: !env_var SONARR_API_KEY

    quality_definition:
      type: series

    media_management:
      propers_and_repacks: do_not_prefer

    quality_profiles:
      - trash_id: 58e8dc75731040612dd6f4ac0676bfd7 # [French MULTi.VF] HD Bluray + WEB (1080p)
        min_format_score: -300
        reset_unmatched_scores:
          enabled: true

    custom_format_groups:
      skip:
        - 158188097a58d7687dee647e04af0da3 # Golden Rule HD: would penalize x265 1080p (Apple TV plays it fine, saves disk)

    custom_formats:
      - trash_ids:
          - 5964f2a8b3be407d083498e4459d05d0 # DTS
          - c1a25cd67b5d2e08287c957b1eb903ec # DTS-ES
          - cfa5fbd8f02a86fc55d8d223d06a5e1f # DTS-HD HRA
          - c429417a57ea8c41d57e6990a8b0033f # DTS-HD MA
          - 9d00418ba386a083fbf4d58235fc37ef # DTS X
          - 1808e4b9cee74e064dfae3f1db99dbfe # TrueHD
          - 0d7824bb924701997f874e7ff7d4844a # TrueHD Atmos
          - 7470a681e6205243983c4410ee4c920f # VC-1
        assign_scores_to:
          - trash_id: 58e8dc75731040612dd6f4ac0676bfd7
            score: -300

radarr:
  movies:
    base_url: http://radarr.media.svc.woohp.local:7878
    api_key: !env_var RADARR_API_KEY

    quality_definition:
      type: movie

    media_management:
      propers_and_repacks: do_not_prefer

    quality_profiles:
      - trash_id: 500ecc23572575511fd81893777d1e06 # [French MULTi.VF] HD Bluray + WEB (default)
        min_format_score: -300
        reset_unmatched_scores:
          enabled: true
      - trash_id: 2572ce3ea4eef1c19d59e0e20ed1cea7 # [French MULTi.VO] HD Bluray + WEB (films without VF)
        min_format_score: -300
        reset_unmatched_scores:
          enabled: true

    custom_format_groups:
      skip:
        - f8bf8eab4617f12dfdbd16303d8da245 # Golden Rule HD: would penalize x265 1080p (Apple TV plays it fine, saves disk)

    custom_formats:
      - trash_ids:
          - 1c1a4c5e823891c75bc50380a6866f73 # DTS
          - f9f847ac70a0af62ea4a08280b859636 # DTS-ES
          - 8e109e50e0a0b83a5098b056e13bf6db # DTS-HD HRA
          - dcf3ec6938fa32445f590a4da84256cd # DTS-HD MA
          - 2f22d89048b01681dde8afe203bf2e95 # DTS X
          - 3cafb66171b47f226146a0770576870f # TrueHD
          - 496f355514737f7d83bf7aa4d24f8169 # TrueHD Atmos
          - 11cd1db7165d6a7ad9a83bc97b8b1060 # VC-1
        score: -300
        assign_scores_to:
          - trash_id: 500ecc23572575511fd81893777d1e06
          - trash_id: 2572ce3ea4eef1c19d59e0e20ed1cea7
