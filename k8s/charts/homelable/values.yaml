image:
  backend: ghcr.io/pouzor/homelable-backend
  frontend: ghcr.io/pouzor/homelable-frontend
  mcp: ghcr.io/pouzor/homelable-mcp
  tag: "3.6.0"
  pullPolicy: IfNotPresent

host: homelable.raccoon-pence.ts.net

env:
  AUTH_MODE: local
  AUTH_USERNAME: admin
  SCANNER_RANGES: '["192.168.1.0/24"]'
  STATUS_CHECKER_INTERVAL: "60"
  SQLITE_PATH: /app/data/homelab.db

persistence:
  data:
    storageClass: longhorn
    size: 2Gi

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: tailscale
  hosts:
    - host: homelable
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - homelable
      secretName: homelable-tls

resources:
  backend:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
  frontend:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {cpu: 100m, memory: 128Mi}
  mcp:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {cpu: 200m, memory: 256Mi}
