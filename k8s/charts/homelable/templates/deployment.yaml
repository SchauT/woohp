apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "homelable.fullname" . }}
  labels:
    {{- include "homelable.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "homelable.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "homelable.labels" . | nindent 8 }}
    spec:
      enableServiceLinks: false
      containers:
        - name: backend
          image: "{{ .Values.image.backend }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "homelable.fullname" . }}-env
            - secretRef:
                name: {{ include "homelable.fullname" . }}-secrets
          securityContext:
            capabilities:
              add: [NET_RAW]
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources.backend | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /app/data
        - name: frontend
          image: "{{ .Values.image.frontend }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: BACKEND_UPSTREAM
              value: "localhost:8000"
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources.frontend | nindent 12 }}
        - name: mcp
          image: "{{ .Values.image.mcp }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: BACKEND_URL
              value: "http://localhost:8000"
          envFrom:
            - secretRef:
                name: {{ include "homelable.fullname" . }}-secrets
          ports:
            - name: mcp
              containerPort: 8001
              protocol: TCP
          resources:
            {{- toYaml .Values.resources.mcp | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "homelable.fullname" . }}-data
