apiVersion: v1
kind: Secret
metadata:
  name: {{ include "homelable.fullname" . }}-secrets
  labels:
    {{- include "homelable.labels" . | nindent 4 }}
stringData:
  SECRET_KEY: {{ .Values.secretKey | quote }}
  AUTH_PASSWORD_HASH: {{ .Values.authPasswordHash | quote }}
  MCP_API_KEY: {{ .Values.mcpApiKey | quote }}
  MCP_SERVICE_KEY: {{ .Values.mcpServiceKey | quote }}
