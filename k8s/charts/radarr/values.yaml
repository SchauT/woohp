image:
  repository: radarr/radarr
  pullPolicy: IfNotPresent
  tag: "6.1.1.10360"

containerPort: 7878

securityContext:
  runAsUser: 3001
  runAsGroup: 3001
  fsGroup: 3001

env:
  TZ: "Europe/Paris"

persistence:
  config:
    storageClass: longhorn
    size: 5Gi

service:
  type: ClusterIP
  port: 7878

ingress:
  enabled: true
  className: tailscale
  hosts:
    - host: radarr
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - radarr
      secretName: radarr-tls

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi
