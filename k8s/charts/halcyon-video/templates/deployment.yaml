apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "halcyon-video.fullname" . }}
  labels:
    {{- include "halcyon-video.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "halcyon-video.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "halcyon-video.labels" . | nindent 8 }}
    spec:
      enableServiceLinks: false
      containers:
        - name: halcyon-video
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
