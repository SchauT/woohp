traefik:
  ingressClass:
    # tailscale stays the class for private apps; only ingresses asking for traefik go public
    isDefaultClass: false
  # No LoadBalancer on bare metal: the home router forwards WAN 80/443 to the
  # Talos VIP 192.168.1.100:30080/30443 (HA across control planes). Requires
  # kube-proxy nodePortAddresses covering the VIP, see talos/talconfig.yaml
  service:
    spec:
      type: NodePort
  providers:
    kubernetesIngress:
      # NodePort Service has no LB status to copy: publish the VIP instead,
      # otherwise every traefik Ingress stays Progressing in ArgoCD
      publishedService:
        enabled: false
      ingressEndpoint:
        ip: 192.168.1.100
  ports:
    web:
      nodePort: 30080
    websecure:
      nodePort: 30443
