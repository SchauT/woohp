apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opengym.fullname" . }}
  labels:
    {{- include "opengym.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Data is JSON files on a RWO volume: two API processes must never write them at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "opengym.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "opengym.labels" . | nindent 8 }}
    spec:
      enableServiceLinks: false
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          env:
            - name: PORT
              value: "3000"
            - name: DATA_DIR
              value: /data
            {{- range $k, $v := .Values.api.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          ports:
            - name: api
              containerPort: 3000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/health
              port: api
          livenessProbe:
            httpGet:
              path: /api/health
              port: api
            initialDelaySeconds: 30
          {{- with .Values.api.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          env:
            # nginx runs as uid 101 and cannot bind <1024 without the sysctl.
            - name: NGINX_PORT
              value: "8080"
            # Same pod network: the API is on localhost, no resolver needed.
            - name: BACKEND
              value: 127.0.0.1
            - name: PORT
              value: "3000"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
          {{- with .Values.web.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "opengym.fullname" . }}-data
