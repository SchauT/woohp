- name: News & Feeds
    columns:
      - size: small
        widgets:
          # 1. NEWS GLOBALES
          - type: rss
            title: 🇫🇷 Actualités
            urls:
              - https://www.lemonde.fr/rss/une.xml
              - https://www.mediapart.fr/articles/feed
            limit: 10
            collapse-after: 5

          # 3. PIRATE SCENE
          - type: rss
            title: 🏴‍☠️ TorrentFreak
            url: https://feeds.feedburner.com/tf
            limit: 8

      - size: full
        widgets:
          # 2. GROUPE REDDIT (Système d'onglets)
          - type: group
            widgets:
              - type: reddit
                subreddit: selfhosted
                title: 🏠 Self-Hosted
                style: vertical-list
                limit: 10
              - type: reddit
                subreddit: homelab
                title: 🛠️ Homelab
                style: vertical-list
                limit: 10

          # 4. VEILLE SRE & INFRA
          - type: rss
            title: ☁️ SRE & Cloud Native
            urls:
              - https://kubernetes.io/feed.xml
              - https://blog.cloudflare.com/rss/
              - https://www.cncf.io/blog/feed/
            limit: 10
            collapse-after: 5

          # 5. CYBERSECU
          - type: hacker-news
            title: 🛡️ Hacker News
            limit: 10
