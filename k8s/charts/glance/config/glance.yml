# Server configuration
server:
  port: 8080

# Theme configuration
theme:
  background-color: 225 14 15
  primary-color: 265 89 79
  contrast-multiplier: 1.2
  positive-color: 96 44 68
  negative-color: 359 68 71

# Branding
branding:
  app-name: "Le Woohp"
  logo-text: "WOOHP"
  custom-footer: |
    <p>KWAK KWAK</p>

# Pages configuration
pages:
  - name: Home
    columns:
      - size: small
        widgets:
          - type: clock
            hour-format: 24h

          - type: calendar

          - type: weather
            location: Paris, France
            units: metric
            hour-format: 24h

          - type: twitch-channels
            channels:
              - Alderiate
              - Splinter
              - Kamet0
              - otplol_
              - Ricadam_lol
              - TraYtoNlol
              - pandorelol
              - Chap_GG

      - size: full
        widgets:
          - $include: random-duck.yml

      - size: small
        widgets:
          - type: search
            search-engine: duckduckgo
            bangs:
              - title: YouTube
                shortcut: "!yt"
                url: https://www.youtube.com/results\?search_query\=\{QUERY\}
              - title: GitHub
                shortcut: "!gh"
                url: https://github.com/search\?q\=\{QUERY\}
              - title: Docker Hub
                shortcut: "!dh"
                url: https://hub.docker.com/search\?q\=\{QUERY\}

          - type: bookmarks
            groups:
              - title: Entertainment
                color: 10 70 50
                links:
                  - title: Netflix
                    url: https://www.netflix.com/
                    icon: si:netflix
                  - title: Disney+
                    url: https://www.disneyplus.com/
                    icon: si:disney
                  - title: YouTube
                    url: https://www.youtube.com/
                    icon: si:youtube
                  - title: Prime Video
                    url: https://www.primevideo.com/
                    icon: si:amazon
              - title: Quick Links
                links:
                  - title: GitHub
                    url: https://github.com/SchauT/woohp
                    icon: si:github
                  - title: Cloudflare
                    url: https://dash.cloudflare.com
                    icon: si:cloudflare
                  - title: Docker Hub
                    url: https://hub.docker.com
                    icon: si:docker
                  - title: Proton
                    url: https://account.protonvpn.com/dashboardV2
                    icon: si:proton

          - type: to-do

  - name: News & Feeds
    columns:
      - size: small
        widgets:
          # 1. NEWS GLOBALES
          - type: rss
            title: 🇫🇷 Actualités
            urls:
              - https://www.lemonde.fr/rss/une.xml
              - https://www.mediapart.fr/articles/feed
            limit: 10
            collapse-after: 5

          # 3. PIRATE SCENE
          - type: rss
            title: 🏴‍☠️ TorrentFreak
            url: https://feeds.feedburner.com/tf
            limit: 8

      - size: full
        widgets:
          # 2. GROUPE REDDIT (Système d'onglets)
          - type: group
            widgets:
              - type: reddit
                subreddit: selfhosted
                title: 🏠 Self-Hosted
                style: vertical-list
                limit: 10
              - type: reddit
                subreddit: homelab
                title: 🛠️ Homelab
                style: vertical-list
                limit: 10

          # 4. VEILLE SRE & INFRA
          - type: rss
            title: ☁️ SRE & Cloud Native
            urls:
              - https://kubernetes.io/feed.xml
              - https://blog.cloudflare.com/rss/
              - https://www.cncf.io/blog/feed/
            limit: 10
            collapse-after: 5

          # 5. CYBERSECU
          - type: hacker-news
            title: 🛡️ Hacker News
            limit: 10


  - name: System
    columns:
      - size: full
        widgets:
          - type: server-stats
            title: Server Statistics
            servers:
              - type: local
                name: AuschHome Server
                hide-mountpoints-by-default: true
                mountpoints:
                  "/":
                    hide: false
                  "/var/auschome":
                    hide: false

      - size: small
        widgets:
          - type: releases
            title: Latest Releases
            repositories:
              - glanceapp/glance
              - jellyfin/jellyfin
              - sonarr/sonarr
              - radarr/radarr
              - prowlarr/prowlarr
              - qbittorrent/qbittorrent
            limit: 8
            collapse-after: 5
